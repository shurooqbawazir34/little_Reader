services:
  api:
    build: .
    env_file: .env
    restart: unless-stopped
    volumes:
      - little_reader_data:/data
    expose:
      - "8000"
  web:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    restart: unless-stopped
volumes:
  little_reader_data: