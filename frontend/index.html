<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>القارئ الصغير (Copy)</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Baloo+Bhaijaan+2:wght@400;500;600;700;800&family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Layout: promise + roles → problem (3 stats) → what is new (5 innovations + competitor matrix) → TALE method (loop, steps with evidence, reading ladder, dialect bridge)
   → guided 7-step evening (stepper, phone, explainer panel: who / what / try / why) → desktop parent dashboard → research → live AI → close.
   Role colours stay fixed everywhere: child = coral, parent = blue, AI = yellow. */
:root{
  --paper:#F3F1FF; --ink:#1F2547; --muted:#5D6689; --line:#DCD8F2; --card:#FFFFFF;
  --night:#1B1F5E; --night2:#2E2F86; --lamp:#FFC23D; --lamp-soft:#FFF1CC;
  --coral:#FF6F59; --coral-deep:#E2523D; --mint:#1FA585; --mint-soft:#D6F5EB; --grape:#6E56F0; --grape-soft:#ECE8FF;
  --f-display:"Fredoka","Trebuchet MS",system-ui,sans-serif;
  --f-ui:"Nunito","Segoe UI",system-ui,sans-serif;
  --f-read:"Andika","Segoe UI",system-ui,sans-serif;
  --r-s:12px; --r-m:20px; --r-l:28px;
  color-scheme:light;
}
:root[lang=ar]{--f-display:"Baloo Bhaijaan 2","Segoe UI",Tahoma,sans-serif;--f-ui:"Baloo Bhaijaan 2","Segoe UI",Tahoma,sans-serif;--f-read:"Baloo Bhaijaan 2","Segoe UI",Tahoma,sans-serif}
:root[lang=ar] *{letter-spacing:0 !important}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{background:var(--paper);color:var(--ink);font-family:var(--f-ui);font-size:16px;line-height:1.55;overflow-x:hidden}
h1,h2,h3,h4{font-family:var(--f-display);line-height:1.12;margin:0;text-wrap:balance;font-weight:600}
p{margin:0}
button,textarea,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--grape);outline-offset:2px;border-radius:8px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.eyebrow{font-weight:800;font-size:.8rem;letter-spacing:.12em;text-transform:uppercase;color:var(--coral-deep)}
.sv-bob{animation:svbob 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.sv-float{animation:svfloat 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.sv-wiggle{animation:svwig 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.sv-tw{animation:svtw 2.4s ease-in-out infinite}
@keyframes svbob{50%{transform:translateY(-7px)}}
@keyframes svfloat{50%{transform:translateY(-12px)}}
@keyframes svwig{25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
@keyframes svtw{50%{opacity:.3}}

/* header */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:rgba(243,241,255,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:16px;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:700;font-size:1.35rem;text-decoration:none;color:var(--ink);white-space:nowrap}
.brand svg{width:40px;height:40px;flex:none}
.brand b{color:var(--coral)}
.top nav{display:flex;gap:18px;margin-inline-start:auto;font-weight:700;font-size:.95rem}
.top nav a{color:var(--muted);text-decoration:none;white-space:nowrap}
.top nav a:hover{color:var(--ink)}
.langbtn{border:2px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-weight:800;font-size:.9rem;white-space:nowrap;color:var(--ink);cursor:pointer}
@media (max-width:980px){.top nav{display:none}.langbtn{margin-inline-start:auto}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;padding:14px 24px;font-weight:800;font-size:1.02rem;text-decoration:none;transition:transform .15s ease;white-space:nowrap}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:translateY(1px)}
.btn-coral{background:var(--coral);color:#fff;box-shadow:0 5px 0 var(--coral-deep)}
.btn-night{background:var(--night);color:#fff;box-shadow:0 5px 0 #0d1040}
.btn-ghost{background:var(--card);color:var(--ink);box-shadow:0 0 0 2px var(--line) inset,0 5px 0 var(--line)}
.btn-sm{padding:9px 16px;font-size:.92rem}
.btn:disabled{opacity:.5;cursor:default;transform:none}
@media (max-width:560px){.top .btn{display:none}}

/* hero */
.hero .wrap{display:grid;grid-template-columns:1fr 1fr;gap:44px;align-items:center;padding-block:44px 56px}
.hero h1{font-size:clamp(2.4rem,5.4vw,4.2rem);font-weight:700;letter-spacing:-.01em}
.hero h1 em{font-style:normal;color:var(--coral)}
.hero .lede{font-size:1.18rem;color:var(--muted);max-width:33em;margin-top:18px}
.cta{display:flex;gap:12px;flex-wrap:wrap;margin-top:26px}
.duo{position:relative;display:grid;grid-template-columns:1fr auto 1.2fr;gap:14px;align-items:center;max-width:540px;width:100%;justify-self:center}
.talkcard{background:#fff;border-radius:22px 22px 22px 6px;padding:16px;box-shadow:0 14px 30px rgba(31,37,71,.15);display:flex;flex-direction:column;gap:10px}
:root[dir=rtl] .talkcard{border-radius:22px 22px 6px 22px}
.talkcard .lab{font-size:.74rem;font-weight:800;color:var(--muted)}
.talkcard .said{font-family:var(--f-read);font-size:1.15rem;font-weight:700;line-height:1.45}
.talkcard .wave{display:flex;gap:3px;align-items:center;height:24px}
.talkcard .wave i{width:4px;border-radius:4px;background:var(--coral);animation:wave 1s ease-in-out infinite}
@keyframes wave{50%{transform:scaleY(.35)}}
.duo .arrow{font-size:1.9rem;color:var(--coral)}
:root[dir=rtl] .duo .arrow{transform:scaleX(-1)}
.bookcard{background:#fff;border-radius:10px 22px 22px 10px;box-shadow:0 18px 36px rgba(31,37,71,.22);overflow:hidden;transform:rotate(2deg)}
.bookcard .ill{aspect-ratio:9/7;position:relative;background:var(--night)}
.bookcard .ill svg{position:absolute;inset:0;width:100%;height:100%}
.bookcard p{padding:12px 14px 16px;font-family:var(--f-read);font-size:1.05rem;line-height:1.5}
.br{border-bottom:3px dotted var(--mint);color:#0b5f49;font-weight:700;cursor:pointer}
@media (max-width:900px){.hero .wrap{grid-template-columns:1fr}.duo{grid-template-columns:1fr}.duo .arrow{transform:rotate(90deg);justify-self:center}:root[dir=rtl] .duo .arrow{transform:rotate(90deg)}}

/* sections */
.sec .wrap{padding-block:64px 8px}
.sec-head{display:flex;flex-direction:column;gap:10px;max-width:48rem;margin-bottom:28px}
.sec-head h2{font-size:clamp(1.9rem,3.6vw,2.7rem)}
.sec-head p{color:var(--muted);font-size:1.1rem}
.steps4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.st4{background:var(--card);border-radius:var(--r-l);padding:20px;display:flex;flex-direction:column;gap:8px;box-shadow:0 0 0 1.5px var(--line) inset}
.st4 .top4{display:flex;align-items:center;justify-content:space-between}
.st4 .n{width:34px;height:34px;border-radius:50%;background:var(--lamp);display:grid;place-items:center;font-family:var(--f-display);font-weight:600;font-size:1.05rem}
.st4 .ic{font-size:2rem;line-height:1}
.st4 .tm{font-size:.78rem;font-weight:800;color:var(--grape)}
.st4 h3{font-size:1.2rem}
.st4 p{color:var(--muted);font-size:.95rem}
@media (max-width:1000px){.steps4{grid-template-columns:1fr 1fr}}
@media (max-width:560px){.steps4{grid-template-columns:1fr}}
.bridge{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;align-items:center}
.pairs{display:grid;grid-template-columns:1fr 1fr;gap:10px;direction:rtl}
@media (max-width:560px){.pairs{grid-template-columns:minmax(0,1fr)}}
.pair{background:#fff;border-radius:16px;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:8px;box-shadow:0 0 0 1.5px var(--line) inset;font-family:"Baloo Bhaijaan 2",Tahoma,sans-serif;font-size:1.25rem;font-weight:700}
.pair .s{color:var(--coral-deep)}
.pair .b{color:#0b5f49}
.pair i{font-style:normal;color:var(--muted);font-size:1rem}
.bridge .why{background:var(--night);color:#fff;border-radius:var(--r-l);padding:24px;display:flex;flex-direction:column;gap:10px}
.bridge .why h3{font-size:1.35rem}
.bridge .why p{color:#CFD2F2}
.bridge .why cite{font-style:normal;font-size:.82rem;color:#A9AEDD;font-weight:700}
@media (max-width:900px){.bridge{grid-template-columns:1fr}}
.science{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.sc-card{background:var(--card);border-radius:var(--r-m);padding:16px;display:flex;flex-direction:column;gap:6px;box-shadow:0 0 0 1.5px var(--line) inset}
.sc-card .k{font-size:.72rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--grape)}
.sc-card h3{font-size:1.04rem}
.sc-card p{font-size:.9rem;color:var(--muted)}
.sc-card .use{font-size:.86rem;font-weight:800;background:var(--lamp-soft);border-radius:10px;padding:6px 8px}
.sc-card cite{font-style:normal;font-size:.78rem;color:var(--muted);font-weight:800;margin-top:auto;direction:ltr;text-align:start}
@media (max-width:1100px){.science{grid-template-columns:1fr 1fr}}
@media (max-width:560px){.science{grid-template-columns:1fr}}
.safe{margin-top:16px;display:flex;flex-wrap:wrap;gap:8px}
.safe span{background:var(--mint-soft);color:#0d5e4b;border-radius:999px;padding:8px 14px;font-weight:800;font-size:.9rem}

/* stage */
.stage{background:radial-gradient(circle at 1px 1px,#d8d3f3 1.4px,transparent 0) 0 0/22px 22px,#E6E2FB;border-block:1px solid var(--line);margin-top:64px;scroll-margin-top:60px}
.stage .wrap{display:grid;grid-template-columns:372px minmax(0,1fr);gap:44px;align-items:start;padding-block:40px}
@media (max-width:900px){.stage .wrap{grid-template-columns:minmax(0,1fr);gap:20px}}
#phoneSlot{display:flex;justify-content:center;min-width:0}
.side{display:flex;flex-direction:column;gap:16px;min-width:0}
.rail{background:#fff;border-radius:var(--r-l);padding:22px;display:flex;flex-direction:column;gap:10px}
.rail h2{font-size:1.6rem}
.rail .stp{display:flex;gap:12px;align-items:flex-start;padding:10px 12px;border-radius:14px;transition:background .3s}
.rail .stp b{width:30px;height:30px;border-radius:50%;flex:none;display:grid;place-items:center;background:var(--paper);font-family:var(--f-display)}
.rail .stp strong{display:block;font-family:var(--f-display);font-weight:600;font-size:1.05rem}
.rail .stp span{color:var(--muted);font-size:.92rem}
.rail .stp.on{background:var(--lamp-soft)}
.rail .stp.on b{background:var(--lamp)}
.rail .stp.done b{background:var(--mint);color:#fff}
.rail .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:4px}
.live{background:var(--night);color:#fff;border-radius:var(--r-l);padding:22px;display:flex;flex-direction:column;gap:10px}
.live h3{font-size:1.3rem}
.live p{color:#CFD2F2;font-size:.95rem}
.live textarea{width:100%;min-height:110px;border-radius:14px;border:0;padding:12px;font-family:var(--f-read);font-size:1rem;color:var(--ink);background:#fff;resize:vertical}
.live .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.live .msg{font-size:.88rem;font-weight:700;color:var(--lamp)}
.live .seg{display:flex;gap:6px}
.live .seg button{border:0;border-radius:999px;padding:6px 12px;font-weight:800;background:rgba(255,255,255,.15);color:#fff}
.live .seg button[aria-pressed=true]{background:#fff;color:var(--ink)}

/* phone (fixed inner size, scaled as a whole) */
.pfit{position:relative;flex:none}
.phone{position:absolute;top:0;left:0;width:372px;height:790px;transform-origin:top left;border-radius:46px;background:var(--ink);padding:11px;box-shadow:0 30px 60px rgba(31,37,71,.28),0 0 0 2px #3a4170 inset}
.phone::after{content:"";position:absolute;top:18px;left:50%;width:96px;height:24px;transform:translateX(-50%);background:var(--ink);border-radius:20px;z-index:40}
.device{position:relative;width:100%;height:100%;border-radius:36px;overflow:hidden;background:var(--night);display:flex;flex-direction:column}
.device.light{background:#FBFAFF}
.status{flex:none;height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 26px;font-weight:800;font-size:.8rem;position:relative;z-index:30;direction:ltr;color:#fff}
.device.light .status{color:var(--ink)}
.screens{position:relative;flex:1;min-height:0}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;overflow-y:auto;overflow-x:hidden;scrollbar-width:none}
.screen::-webkit-scrollbar{display:none}
.screen.enter{animation:enter .4s ease both}
@keyframes enter{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

/* home */
.s-home{background:linear-gradient(180deg,#1B1F5E,#3A3593 70%,#5A4BB0);color:#fff;padding:6px 20px 20px;gap:14px}
.who{align-self:flex-start;display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.14);border:0;border-radius:999px;padding:5px 12px 5px 5px;color:#fff;font-weight:800;font-size:.86rem}
:root[dir=rtl] .who{padding:5px 5px 5px 12px}
.who i{width:30px;height:30px;border-radius:50%;background-size:cover;background-position:center;box-shadow:0 0 0 2px var(--lamp)}
.s-home .hud{width:150px;align-self:center;margin-top:6px}
.s-home h3{font-size:1.6rem;text-align:center}
.s-home .sub{text-align:center;color:#D9DBF7;font-weight:600}
.s-home .btn{width:100%}
.shelf-t{display:flex;justify-content:space-between;font-weight:800;font-size:.85rem;color:#D9DBF7;margin-top:6px}
.shelf{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.mini{aspect-ratio:3/4;border-radius:6px 12px 12px 6px;display:flex;flex-direction:column;justify-content:flex-end;padding:6px;font-size:.62rem;font-weight:800;line-height:1.15;color:#fff;position:relative;overflow:hidden;box-shadow:0 6px 12px rgba(0,0,0,.25)}
.mini span{font-size:1.4rem;position:absolute;top:8px;inset-inline-start:8px}
.mini.new{border:2px dashed rgba(255,255,255,.5);background:transparent;box-shadow:none;align-items:center;justify-content:center;font-size:1.6rem;color:rgba(255,255,255,.6)}
.mini.fresh{animation:slidein .8s cubic-bezier(.2,1.4,.4,1) both}
@keyframes slidein{from{transform:translateY(-120px) rotate(-20deg);opacity:0}to{transform:none;opacity:1}}

/* talk */
.s-talk{background:linear-gradient(180deg,#1B1F5E,#2E2F86);color:#fff;padding:4px 16px 16px;gap:10px}
.thead{display:flex;align-items:center;gap:10px}
.thead .hud{width:62px;flex:none}
.thead .qn{font-size:.78rem;font-weight:800;color:var(--lamp)}
.thread{flex:1;display:flex;flex-direction:column;gap:10px;overflow-y:auto;padding-block:6px;scrollbar-width:none}
.thread::-webkit-scrollbar{display:none}
.msg{max-width:84%;border-radius:18px;padding:10px 13px;font-family:var(--f-read);font-size:1.05rem;line-height:1.45;animation:enter .35s ease both}
.msg.h{align-self:flex-start;background:#fff;color:var(--ink);border-end-start-radius:4px}
.msg.c{align-self:flex-end;background:var(--coral);color:#fff;border-end-end-radius:4px;font-weight:700}
.msg.c small{display:block;font-family:var(--f-ui);font-size:.68rem;font-weight:800;opacity:.85;margin-bottom:2px}
.micbar{display:flex;flex-direction:column;align-items:center;gap:6px}
.bigmic{width:84px;height:84px;border-radius:50%;border:0;background:var(--coral);color:#fff;font-size:2rem;box-shadow:0 6px 0 var(--coral-deep),0 0 0 10px rgba(255,111,89,.18)}
.bigmic.on{background:var(--mint);box-shadow:0 6px 0 #157a62,0 0 0 14px rgba(31,165,133,.25);animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 6px 0 #157a62,0 0 0 22px rgba(31,165,133,.08)}}
.micbar small{color:#D9DBF7;font-weight:700;font-size:.8rem}
.micbar .btn{width:100%}
.sim{font-size:.66rem;color:#A9AEDD;text-align:center;font-weight:700}

/* making */
.s-making{background:linear-gradient(180deg,#262c6d,#5a4fb0);color:#fff;align-items:center;justify-content:center;text-align:center;padding:22px;gap:16px}
.s-making h3{font-size:1.4rem}
.flips{display:flex;flex-direction:column;gap:8px;width:100%;direction:rtl}
.flip{display:flex;align-items:center;justify-content:center;gap:10px;font-family:"Baloo Bhaijaan 2",Tahoma,sans-serif;font-size:1.3rem;font-weight:700;opacity:0;transform:translateY(8px);transition:all .5s}
.flip.on{opacity:1;transform:none}
.flip .s{background:rgba(255,111,89,.25);border-radius:10px;padding:2px 12px;text-decoration:line-through;text-decoration-color:rgba(255,255,255,.5)}
.flip .b{background:var(--mint);border-radius:10px;padding:2px 12px}
.flip i{font-style:normal;color:var(--lamp)}
.flip em{font-style:normal;font-family:var(--f-ui);font-size:.72rem;color:#CFD2F2;direction:ltr}
.mksteps{list-style:none;padding:0;margin:0;display:grid;gap:5px;text-align:start;font-weight:700;font-size:.9rem}
.mksteps li{opacity:.35;transition:opacity .3s}
.mksteps li.on{opacity:1}
.mksteps li.on::before{content:"✓ ";color:var(--lamp)}
.mksteps li:not(.on)::before{content:"○ "}

/* book */
.s-book{background:#FBFAFF;color:var(--ink)}
.bbar{flex:none;display:flex;align-items:center;gap:8px;padding:2px 14px 8px}
.bbar .x{width:34px;height:34px;border-radius:50%;border:0;background:var(--paper);font-weight:800}
.bbar .bt{flex:1;font-family:var(--f-display);font-weight:600;font-size:.95rem;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bbar .pg{font-weight:800;font-size:.8rem;color:var(--muted);min-width:34px;text-align:end}
.bpage{flex:1;min-height:0;display:flex;flex-direction:column;animation:turn .45s ease both}
@keyframes turn{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:none}}
:root[dir=rtl] .bpage{animation-name:turnr}
@keyframes turnr{from{opacity:0;transform:translateX(-30px)}to{opacity:1;transform:none}}
.bill{flex:1;min-height:0;position:relative;margin:0 14px;border-radius:20px;overflow:hidden;background:var(--night)}
.bill svg{position:absolute;inset:0;width:100%;height:100%}
.btext{flex:none;padding:12px 18px 6px;display:flex;flex-direction:column;gap:9px}
.ntext{font-family:var(--f-read);font-size:1.12rem;line-height:1.55}
:root[lang=ar] .ntext{font-size:1.18rem;line-height:1.75}
.brtip{background:var(--mint-soft);color:#0b5f49;border-radius:12px;padding:7px 10px;font-weight:800;font-size:.85rem}
.cline{display:flex;gap:10px;align-items:flex-end}
.cface{width:42px;height:42px;border-radius:50%;background-size:cover;background-position:center;flex:none;box-shadow:0 0 0 3px var(--lamp)}
.cbub{flex:1;background:var(--grape-soft);border-radius:18px 18px 18px 4px;padding:7px 12px}
:root[dir=rtl] .cbub{border-radius:18px 18px 4px 18px}
.cbub small{display:block;font-size:.7rem;font-weight:800;color:var(--grape)}
.cbub .ct{font-family:var(--f-read);font-weight:700;font-size:1.22rem;line-height:1.4}
.w{border-radius:6px;transition:background .2s,color .2s;padding:0 1px}
.w.cur{background:var(--lamp)}
.w.ok{background:#C9F1E3;color:#0b5f49}
.btools{display:flex;gap:8px}
.rmic{flex:1;border:0;border-radius:999px;background:var(--coral);color:#fff;font-weight:800;padding:10px 12px;box-shadow:0 4px 0 var(--coral-deep)}
.rmic.on{background:var(--mint);box-shadow:0 4px 0 #157a62}
.rmic.done{background:var(--mint-soft);color:#0d6b52;box-shadow:none}
.rsay{border:0;border-radius:999px;background:var(--paper);font-weight:800;padding:10px 14px}

.chart{margin-bottom:22px}
.chart .plot{position:relative;display:flex;align-items:flex-end;gap:5px;border-bottom:1.5px solid #C9CDE3;padding-bottom:0;direction:ltr}
.chart .grid{position:absolute;inset:0 0 0 0;display:flex;flex-direction:column;justify-content:space-between;pointer-events:none}
.chart .grid i{border-top:1px dashed #E3E5F2;height:0}
.chart .col{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:stretch;position:relative;cursor:default}
.chart .col .bar2{background:var(--child);border-radius:4px 4px 0 0;min-height:2px;transition:filter .15s}
.chart .col:hover .bar2{filter:brightness(.9)}
.chart .col.miss .bar2{background:none;border:1.5px dashed #C9CDE3;border-bottom:0;height:100%;border-radius:4px 4px 0 0}
.chart .col .xl{position:absolute;bottom:-20px;left:0;right:0;text-align:center;font-size:.68rem;color:var(--muted)}
.chart .col .lb{position:absolute;left:-10px;right:-10px;text-align:center;font-size:.72rem;font-weight:800;color:var(--ink)}
.chart .step{position:absolute;top:0;bottom:0;border-left:2px dotted var(--grape)}
.chart .step span{position:absolute;top:-2px;left:4px;font-size:.7rem;font-weight:800;color:var(--grape);white-space:nowrap;background:#F7F9FF;padding:0 3px}
.tip{position:absolute;z-index:5;background:var(--ink);color:#fff;border-radius:10px;padding:6px 10px;font-size:.78rem;font-weight:700;pointer-events:none;white-space:nowrap;transform:translate(-50%,-110%)}
.chart-foot{font-size:.78rem;color:var(--muted);margin-top:26px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.week div{background:#fff;border-radius:12px;padding:8px 4px;text-align:center;display:flex;flex-direction:column;gap:2px;box-shadow:0 0 0 1px var(--line) inset}
.week b{font-size:.7rem;color:var(--muted)}
.week span{font-size:1.4rem}
.week small{font-size:.66rem;font-weight:700;line-height:1.2}
.okline{display:flex;gap:10px;align-items:flex-start;font-size:.9rem}
.okline i{font-style:normal;font-size:1.2rem}
.future{background:var(--grape-soft);border-radius:var(--r-m);padding:14px 16px;margin-top:14px;font-weight:700;color:#4B3FB0}

/* research */
.proc{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.pr{background:#fff;border-radius:var(--r-m);padding:16px;box-shadow:0 0 0 1.5px var(--line) inset;display:flex;flex-direction:column;gap:6px;position:relative}
.pr i{font-style:normal;font-size:1.6rem}
.pr h3{font-size:1.05rem}
.pr p{font-size:.9rem;color:var(--muted)}
.pr .st{position:absolute;top:12px;inset-inline-end:12px}
@media (max-width:900px){.proc{grid-template-columns:1fr 1fr}}
.rtab{width:100%;border-collapse:collapse;background:#fff;font-size:.92rem;min-width:720px}
.rtab th,.rtab td{padding:10px 12px;text-align:start;border-bottom:1px solid var(--line);vertical-align:top}
.rtab th{font-size:.78rem;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.06em;background:#FBFAFF}
.rtab td:nth-child(2){font-size:.82rem;color:var(--muted);font-weight:700;direction:ltr;text-align:start}
.rtab td:nth-child(3){font-weight:800;color:#0b5f49}
.honest{margin-top:16px;background:var(--lamp-soft);border-radius:var(--r-m);padding:14px 16px;font-weight:700}

/* live */
.livesec .live{max-width:760px}

/* video mode (used only to record the walkthrough video) */
body.video .top,body.video main>section:not(#journey),body.video .stepper,body.video .panel,body.video .jhead,body.video .foot{display:none!important}
body.video{background:linear-gradient(135deg,#1B1F5E,#3A3593)}
body.video .journey{margin:0;border:0;background:transparent;min-height:100vh}
body.video .journey .wrap{max-width:none;padding:30px 110px;min-height:100vh;display:flex;align-items:center}
body.video .jgrid{grid-template-columns:auto 1fr;gap:90px;align-items:center;margin:0;width:100%}
.vcap{display:none}
body.video .vcap{display:flex;flex-direction:column;gap:18px;color:#fff;max-width:840px;text-align:start}
.vcap .k{font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--lamp);font-size:1.25rem}
.vcap .who3{display:flex;gap:10px}
.vcap .who3 .badge{font-size:1.15rem;padding:6px 16px}
.vcap h2{font-size:4rem;font-weight:700;line-height:1.08}
.vcap p{font-size:1.8rem;color:#D9DBF7;line-height:1.45}
.vcap .logo{display:flex;align-items:center;gap:14px;font-family:var(--f-display);font-weight:700;font-size:2rem;margin-bottom:14px}
.vcap .logo svg{width:64px;height:64px}
.vcap .logo b{color:var(--coral)}
.vcap.fade{animation:enter .6s ease both}

.foot .wrap{padding-block:56px 64px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px}
.foot h2{font-size:clamp(1.8rem,3.6vw,2.8rem);max-width:22em}
.foot small{color:var(--muted);font-size:.84rem;max-width:46rem}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none !important;transition:none !important}html{scroll-behavior:auto}}

  ['Talk','2 min',['c'],'The child tells the day','Hudhud asks three questions. The child answers out loud, in their own dialect.','Tap the microphone. Do it three times.','Open questions get young children talking more.','Whitehurst et al. 1988'],
  ['Book','20 sec',['a'],'The day becomes a book','First a safety check. Then the AI writes 5 pages in simple Fusha and draws the child as the hero. Dialect words become book words.','Watch the words cross the bridge. Then press "Open my book".','Children learn new words faster from books about themselves.','Kucirkova, Messer & Sheehy 2014'],
  ['Read','5 min',['p','c'],'Read it together','Every page has two parts. The parent reads the story (blue). The child reads their own line (coral).','Press "{n} reads". Tap a green word to see the bridge. Use › to turn pages.','The adult reads most at first, then hands the reading over step by step.','Pearson & Gallagher 1983'],
  ['Goodnight','1 min',['c'],'Shelf, mission, goodnight','The book goes on the life library shelf. The child gets a tiny mission for tomorrow and can send the book to Grandma. Then the app locks until 7 AM.','Press "Send to Grandma", then "Goodnight".','A calm ending is better than fast screens before sleep.','Lillard & Peterson, Pediatrics 2011'],
  ['Morning','7:30 AM',['p'],'The parent\'s morning view','How the day felt, one question to ask, the new book words, and the child\'s step on the ladder. Tonight Hudhud asks about the mission, and the loop closes.','Switch between Today, Progress and Settings.','Children learn more from media when adults join in.','Co-use meta-analysis, 17 studies, 2024']],

/* ---------- photo → cartoon (stand-in for the AI image model) ---------- */
function cartoonize(src){
  return new Promise(res => {
    const img = new Image();
    img.onload = () => {
      const N = 320, m = Math.min(img.width, img.height);
      const mk = n => { const c = document.createElement('canvas'); c.width = c.height = n; return c; };
      const base = mk(N), bx = base.getContext('2d');
      bx.drawImage(img, (img.width-m)/2, (img.height-m)/2, m, m, 0, 0, N, N);
      const photo = base.toDataURL('image/jpeg', .85);
      const smooth = n => { const s = mk(n); s.getContext('2d').drawImage(base, 0, 0, n, n); const u = mk(N), ux = u.getContext('2d'); ux.imageSmoothingQuality = 'high'; ux.drawImage(s, 0, 0, N, N); return ux.getImageData(0, 0, N, N); };
      const col = smooth(72), soft = smooth(150).data, out = col.data, gray = new Float32Array(N*N);
      for (let i = 0; i < N*N; i++) gray[i] = .299*soft[i*4] + .587*soft[i*4+1] + .114*soft[i*4+2];
      for (let y = 0; y < N; y++) for (let x = 0; x < N; x++){
        const i = y*N + x, p = i*4; let r = out[p], g = out[p+1], b = out[p+2];
        const l = (r + g + b) / 3; r = l + (r-l)*1.45; g = l + (g-l)*1.45; b = l + (b-l)*1.45;
        const lum = Math.max(1, .299*r + .587*g + .114*b), f = Math.min(255, Math.round(lum/255*4)/4*215 + 45) / lum;        r *= f; g *= f; b *= f;
        if (x > 0 && y > 0 && x < N-1 && y < N-1){
          const a = k => gray[k];
          const e = Math.hypot(-a(i-N-1) - 2*a(i-1) - a(i+N-1) + a(i-N+1) + 2*a(i+1) + a(i+N+1), -a(i-N-1) - 2*a(i-N) - a(i-N+1) + a(i+N-1) + 2*a(i+N) + a(i+N+1));
          if (e > 70){ const k = e > 140 ? .18 : .45; r *= k; g *= k; b *= k; }
        }
        out[p] = Math.max(0, Math.min(255, r)); out[p+1] = Math.max(0, Math.min(255, g)); out[p+2] = Math.max(0, Math.min(255, b));
      }
      bx.putImageData(col, 0, 0);
      res({photo, toon: base.toDataURL('image/jpeg', .9)});
    };
    img.src = src;
  });
}

  else if (S.stop === 1){ S.bookDone = false; S.sent = false; S.answers = []; S.talkI = 0; show('s-home'); }
  else if (S.stop === 2){ if (S.answers.length >= 3){ S.answers = []; S.talkI = 0; } show('s-talk'); }
  else if (S.stop === 3){ if (S.answers.length < 3){ S.answers = (S.liveBook ? S.liveBook.said : t('a')).slice(0,3); S.talkI = 3; } makeBook(S.liveBook || sampleBook()); }
  else if (S.stop === 4){ if (!S.book || (!S.book.ai && S.liveBook)) S.book = S.liveBook || sampleBook(); S.page = -1; S.read = {}; show('s-book'); }
  else if (S.stop === 5){ if (!S.book) S.book = S.liveBook || sampleBook(); show('s-end'); }

}

function confetti(cv){
  if (!cv || reduce) return;
  const ctx = cv.getContext('2d'), w = cv.width = cv.offsetWidth * 2, h = cv.height = cv.offsetHeight * 2;
  const cols = ['#FFC23D','#FF6F59','#1FA585','#6E56F0','#5fd0e6'];
  const ps = Array.from({length:100}, () => ({x:w/2, y:h*.3, vx:(Math.random()-.5)*24, vy:-Math.random()*24-6, r:Math.random()*8+5, c:cols[Math.random()*5|0], a:Math.random()*6}));
  let f = 0; (function tick(){ ctx.clearRect(0,0,w,h);
    ps.forEach(p => { p.vy += .9; p.x += p.vx; p.y += p.vy; p.vx *= .985; p.a += .2; ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.a); ctx.fillStyle = p.c; ctx.fillRect(-p.r/2,-p.r/4,p.r,p.r/2); ctx.restore(); });
    if (++f < 130) requestAnimationFrame(tick); else ctx.clearRect(0,0,w,h); })();
}

"""${day}"""
Rules: warm, calm, true to what the child said, no new scary events, no brand names, nothing about appearance or weight. If the day includes something hard, show a gentle healthy way through it. Each page: one narrator sentence (third person, max 22 words) and one short line the child says (first person, max 8 words, easy words).
If the text mentions anything that suggests the child is unsafe (abuse, self-harm, an adult hurting them, a dangerous secret), do NOT write a story: return {"concern": true} only.
"said": split what the child said into exactly 3 short answers (best part, hard part, who they helped), keeping the child's own words.
"bridges": list up to 6 pairs [word the child actually said in dialect/everyday speech, the book word you used instead]. In the narrator text wrap each of those book words in ~tildes~.
"scene" for each page must be one of: park, fall, brave, sister, night, home, school. "props": up to 2 emoji that fit the page.
Reply with ONLY JSON: {"concern":false,"title":"...","said":["...","...","..."],"pages":[{"scene":"park","props":["⚽"],"n":"...","c":"..."}],"bridges":[["...","..."]],"mission":"one tiny kind action for tomorrow","ask":"one question the parent can ask tonight","feel":[["emoji","short label"],["emoji","short label"],["emoji","short label"]]}`;
  try {
    const r = await sample.json(prompt, {signal: liveCtl.signal, modelTier:'default'});
    if (r && r.concern){ msg.textContent = t('live_concern'); return; }
    if (!r || !Array.isArray(r.pages) || !r.pages.length) throw {code:'invalid_json'};
    const bridges = (Array.isArray(r.bridges) ? r.bridges : []).map(x => [String(x[0]||''), String(x[1]||'')]).filter(x => x[0] && x[1]);
    S.liveBook = {title:String(r.title || ''), cover:t('story').cover, ai:true,
      said:(Array.isArray(r.said) ? r.said.map(String) : []).concat(t('a')).slice(0,3),
      pages:r.pages.slice(0,6).map(p => ({sc:String(p.scene||'park'), props:Array.isArray(p.props) ? p.props.map(String).slice(0,2) : [], n:String(p.n||''), c:String(p.c||''), br:bridges})),
      bridges, mission:String(r.mission||''), ask:String(r.ask||''), feel:Array.isArray(r.feel) ? r.feel.map(x => [String(x[0]||'🙂'), String(x[1]||'')]).slice(0,3) : t('feel')};
    msg.textContent = t('live_done');
    $('#journey').scrollIntoView({behavior: reduce ? 'auto' : 'smooth', block:'start'});
    S.answers = []; S.talkI = 0; goStop(3);
  } catch(e){
    msg.textContent = e && (e.code === 'not_granted' || e.code === 'sampling_disabled') ? t('live_off') : t('live_err');
  } finally { btn.disabled = false; }
}

$('#langSel').onchange = e => {
  S.lang = e.target.value; save(); tok++;
  if (S.book && !S.book.ai) S.book = sampleBook();
  renderStatic();
  if (current === 's-making') goStop(4);
  else if (current === 's-talk'){ S.answers = []; S.talkI = 0; show('s-talk'); }
  else show(current);
};

/* phone scaling */
function fit(){
  const f = $('#pfit'), host = f.parentElement;
  const vid = document.body.classList.contains('video');
  const W = vid ? 9999 : (host.clientWidth || 372), H = vid ? innerHeight - 60 : Math.max(560, Math.min(790, innerHeight - 150));
  const s = Math.max(.3, Math.min(vid ? 2 : 1, W/372, H/790));
  f.style.width = 372*s + 'px'; f.style.height = 790*s + 'px';
  $('#phone').style.transform = `scale(${s})`;
}
addEventListener('resize', fit);

/* hooks used only to record the walkthrough video */
const LOGO = '<svg viewBox="0 0 64 64"><path d="M6 18c9-4 18-4 26 2v34c-8-6-17-6-26-2z" fill="#FF6F59"/><path d="M58 18c-9-4-18-4-26 2v34c8-6 17-6 26-2z" fill="#FFC23D"/><circle cx="20" cy="31" r="3" fill="#1F2547"/><circle cx="44" cy="31" r="3" fill="#1F2547"/><path d="M22 40q10 7 20 0" stroke="#1F2547" stroke-width="3.2" fill="none" stroke-linecap="round"/></svg>';
window.LR = {
  video(on){ document.body.classList.toggle('video', on); fit(); },
  cap(k, who, h, p){ const v = $('#vcap'); v.classList.remove('fade'); void v.offsetWidth; v.classList.add('fade');
    v.innerHTML = `<div class="logo">${LOGO}<span>${t('brand')}</span></div>${k ? `<span class="k">${esc(k)}</span>` : ''}${who && who.length ? `<div class="who3">${roleBadges(who)}</div>` : ''}<h2>${esc(h)}</h2>${p ? `<p>${esc(p)}</p>` : ''}`; },
  stop: goStop, show, answer, childReads, next(){ $('#bNext')?.click(); }, tapBridge(){ $('.br', $('#s-book'))?.click(); },
  tab(i){ S.tab = i; renderParent(); }, grandma(){ $('#gma')?.click(); }, night(){ $('#goNight')?.click(); }, consent(){ S.consent = true; renderSetup(false); },
  scroll(id, y){ const s = $('#' + id); s && s.scrollTo({top: y, behavior:'smooth'}); },
  art: { hud: () => HUD, scene: (k, p) => sceneSVG(k, p) },
  lang(l){ if (S.lang !== l && T[l]){ const sel = $('#langSel'); sel.value = l; sel.dispatchEvent(new Event('change')); } }
};

renderStatic(); goStop(0); fit();
})();
</script>
