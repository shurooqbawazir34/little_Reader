server {
 listen 80;
 server_name _;
 root /usr/share/nginx/html;
 index index.html;
 client_max_body_size 6m;
 location /api/ {proxy_pass http://api:8000;proxy_read_timeout 240s;proxy_set_header Host $host;}
 location = / {return 302 /app;}
 location = /app {try_files /app.html =404;}
 location = /presentation {try_files /index.html =404;}
 location / {try_files $uri $uri/ =404;}
}
